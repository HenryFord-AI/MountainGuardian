[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    slow: mark test as slow-running
    integration: mark as integration test
    security: mark as security test
    live: opt-in real DeepSeek API test (requires RUN_LIVE_TESTS=1 and DEEPSEEK_API_KEY)
